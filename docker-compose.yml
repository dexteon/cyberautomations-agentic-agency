version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberautomations-agentic-agency
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - chromadb
      - n8n
    command: python -m cyberautomations_agency.main

  chromadb:
    image: chromadb/chroma:latest
    container_name: cyberautomations-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma

  n8n:
    image: n8nio/n8n:latest
    container_name: cyberautomations-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
